edition = "2024";

package agentpools.azure.flexvm;

option go_package = "github.com/Azure/aks-flex/plugin/pkg/services/agentpools/azure/flexvm";

import "google/protobuf/timestamp.proto";
import "plugin/api/api.proto";
import "plugin/pkg/services/agentpools/api/features/kubeadm/kubeadm.proto";

// AgentPool models a single cross-region Azure VM.
//
// Unlike the ubuntu2404vmss service which manages a Virtual Machine Scale Set,
// flexvm creates one Microsoft.Compute/virtualMachines per AgentPool. This is
// suitable for cross-region placement and matches Karpenter's per-NodeClaim
// resource lifecycle.
//
// The plugin process is assumed to authenticate via DefaultAzureCredential and
// hold Contributor on the target subscription / resource group / subnet.
message AgentPool {
  api.Metadata metadata = 1;

  AgentPoolSpec spec = 2;

  AgentPoolStatus status = 3;
}

message AgentPoolSpec {
  string subscription_id = 1;
  string resource_group  = 2;
  string location        = 3;

  // Full ARM resource ID of the subnet (must already exist).
  string subnet_id = 4;

  // VM SKU, e.g. "Standard_ND96isr_H200_v5".
  string vm_size = 5;

  // ImageReference selects an Azure Marketplace image.
  // Mutually exclusive with image_id.
  ImageReference image_reference = 6;

  // SIG / community gallery image resource ID.
  // Mutually exclusive with image_reference.
  string image_id = 7;

  // Currently only "Standard" is supported. TrustedLaunch is deferred —
  // it has been observed to break the DSVM image during manual H200 bringup.
  string security_type = 8;

  int32 os_disk_size_gb = 9;

  repeated string ssh_public_keys = 10;

  bool allocate_public_ip = 11;

  map<string, string> tags = 12;

  kubeadm.Config kubeadm = 13;
}

message ImageReference {
  string publisher = 1;
  string offer     = 2;
  string sku       = 3;
  string version   = 4;
}

message AgentPoolStatus {
  // Full ARM resource ID of the created VM.
  string vm_resource_id = 1;

  google.protobuf.Timestamp created_at = 2;
}
