apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-sample-h200-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-sample-h200-app
  template:
    metadata:
      labels:
        app: azure-sample-h200-app
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gpu
                    operator: In
                    values:
                      - h200
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                      - Standard_ND96isr_H200_v5
      containers:
        - name: gpu-container
          image: nvidia/cuda:12.4.0-base-ubuntu22.04
          command: ["nvidia-smi", "-l", "60"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
              nvidia.com/gpu: "1"
            limits:
              memory: "1Gi"
              cpu: "500m"
              nvidia.com/gpu: "1"
